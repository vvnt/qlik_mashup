<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- Icônes du mashup : tracé au trait (1,5), extrémités carrées, couleur héritée (currentColor). -->
  <symbol id="icon-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M20 12H5M11 5.5 4.5 12 11 18.5"/>
  </symbol>
  <symbol id="icon-forward" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M4 12h15M13 5.5l6.5 6.5-6.5 6.5"/>
  </symbol>
  <symbol id="icon-clear-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M3 4.5h17l-6.5 8v6.5l-4 2v-8.5z"/>
    <path d="M16 15.5l5 5M21 15.5l-5 5"/>
  </symbol>
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>
  <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M6 9.5l6 6 6-6"/>
  </symbol>
  <symbol id="icon-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M7 17 17 7M8.5 6.5H17.5v9"/>
  </symbol>
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.5 15.5 21 21"/>
  </symbol>
  <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M9.5 6l6 6-6 6"/>
  </symbol>
  <symbol id="icon-star" viewBox="0 0 24 24" style="fill:var(--icon-fill,none)" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M12 3.5l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8z"/>
