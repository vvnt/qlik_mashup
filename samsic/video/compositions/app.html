  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // ---- Outils ------------------------------------------------------------------------------
      const VW = 1440;
      const VH = 900;
      const SENTINEL = 736;          // la bande des filtres colle quand le défilement dépasse 736 − 80
      const scroll = { y: 0 };
      const applyScroll = () => {
        gsap.set("#page", { y: -scroll.y });
        gsap.set("#band", { opacity: scroll.y >= SENTINEL - 80 ? 1 : 0 });
      };
      function scrollTo(to, at, d) {
        tl.to(scroll, { y: to, duration: d, ease: "power2.inOut", onUpdate: applyScroll }, at);
      }

      gsap.set("#cursor", { x: 760, y: 520 });
      const cursor = { x: 760, y: 520 };
      function move(x, y, at, d = 0.5) {
        tl.to("#cursor", { x, y, duration: d, ease: "power2.inOut" }, at);
        cursor.x = x; cursor.y = y;
      }
      function click(at) {
        tl.to("#cursor", { scale: 0.82, duration: 0.08, ease: "power1.out", transformOrigin: "0 0" }, at);
        tl.to("#cursor", { scale: 1, duration: 0.14, ease: "power1.out" }, at + 0.08);
        tl.set("#ripple", { left: cursor.x, top: cursor.y }, at);
        tl.fromTo("#ripple", { scale: 0.3, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, at);
      }
      const show = (id, at) => tl.set(id, { opacity: 1, "--w": "112%" }, at);
      const wipe = (id, at, d = 0.7) => SX.wipeIn(tl, id, at, d);

      // Zoom : le point (px, py) de la page vient en (qx, qy) du cadre, sans jamais montrer de bord vide.
      function zoom(at, d, s, px, py, qx = px, qy = py) {
        const x = Math.min(0, Math.max(VW - VW * s, qx - px * s));
        const y = Math.min(0, Math.max(VH - VH * s, qy - py * s));
        tl.to("#stage", { scale: s, x, y, duration: d, ease: "power2.inOut" }, at);
      }
      const unzoom = (at, d = 0.6) => tl.to("#stage", { scale: 1, x: 0, y: 0, duration: d, ease: "power2.inOut" }, at);

      const caption = (id, from, to) => {
        SX.fadeUp(tl, id, from, 0.5, 24);
        SX.fadeOut(tl, id, to, 0.3);
      };

      // Compteurs des chiffres clés.
      const fr1 = (n) => n.toFixed(1).replace(".", ",");
      [[0, 57.2, " M €"], [1, 7, " M €"], [2, 12.3, " %"]].forEach(([i, end, unit]) => {
        const box = document.getElementById("kpi-" + i);
        const v = { n: 0 };
        tl.fromTo(v, { n: 0 }, {
          n: end, duration: 1.4, ease: "power2.out",
          onUpdate: () => {
            const text = Number.isInteger(end) && v.n >= end - 0.05 ? String(end) : fr1(v.n);
            box.textContent = text + unit;
          },
        }, 0.8 + i * 0.12);
      });

      // ---- 1. Arrivée : chiffres clés, premier défilement, logo qui se réduit ----------------------
      tl.fromTo("#stack", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0);
      caption("#c1", 0.9, 4.1);
      scrollTo(1111, 3.0, 1.6);
      // Logo : 144 px en (16, 0) → 72 px en (31, 6), comme sur le site (transformations seulement).
      tl.fromTo("#logo", { x: 0, y: 0, scale: 1 }, { x: 15, y: 6, scale: 0.5, transformOrigin: "0 0", duration: 0.4, ease: "power2.inOut" }, 3.05);

      // ---- 2. Navigation par le menu ------------------------------------------------------------
      caption("#c2", 4.5, 9.2);
      tl.fromTo("#cursor", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.4);
      move(1203, 40, 4.6, 0.7);
      click(5.4);
      scrollTo(2218, 5.5, 1.2);
      move(1101, 40, 7.0, 0.5);
      click(7.6);
      scrollTo(1111, 7.7, 1.2);
      show("#sel-0", 9.0);

      // ---- 3. Sélection dans les graphiques, hiérarchie, fil d'Ariane -----------------------------
      caption("#c3", 9.4, 11.0);
      move(454, 309, 9.3, 0.6);
      click(10.0);
      wipe("#sel-1", 10.05);
      caption("#c4", 11.25, 14.7);
      zoom(11.0, 0.7, 2.4, 330, 165, 600, 420);
      unzoom(13.0);
      move(456, 309, 13.6, 0.5);
      click(14.2);
      wipe("#sel-2", 14.25);

      // ---- 4. Modifier en place (liste de la puce « Prestation ») ---------------------------------
      caption("#c5", 15.0, 19.7);
      move(608, 138, 15.1, 0.5);
      click(15.7);
      show("#chip-open", 15.75);
      zoom(15.8, 0.5, 1.6, 580, 250, 700, 420);
      move(577, 266, 16.4, 0.4);
      click(16.9);
      show("#chip-add-1", 16.95);
      move(577, 302, 17.1, 0.3);
      click(17.5);
      show("#chip-add-2", 17.55);
      unzoom(17.8, 0.5);
      move(1000, 640, 18.0, 0.4);
      click(18.45);
      show("#chip-done", 18.5);
      move(211, 191, 18.6, 0.5);
      click(19.2);
      wipe("#reset", 19.25);

      // ---- 5. Filtres directs et bouton joker -----------------------------------------------------
      caption("#c6", 20.0, 24.9);
      move(363, 103, 20.1, 0.5);
      click(20.7);
      show("#region-open", 20.75);
      move(440, 268, 21.0, 0.4);
      click(21.5);
      show("#region-done", 21.55);
      move(172, 103, 21.9, 0.5);
      click(22.5);
      show("#more-open", 22.55);
      move(286, 304, 22.8, 0.4);
      click(23.3);
      show("#more-values", 23.35);
      move(286, 240, 23.6, 0.3);
      click(24.0);
      wipe("#more-done", 24.05);

      // ---- 6. Recherche intelligente ----------------------------------------------------------------
      caption("#c7", 25.0, 28.7);
      show("#search-0", 25.0);
      move(1146, 104, 25.1, 0.5);
      click(25.7);
      zoom(25.8, 0.6, 1.7, 1018, 190, 1000, 380);
      show("#search-1", 26.5);
      show("#search-2", 26.85);
      show("#search-3", 27.2);
      tl.fromTo("#keycap", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25 }, 27.55);
      tl.to("#keycap", { y: 4, duration: 0.08 }, 27.85);
      wipe("#search-done", 27.95);
      tl.to("#keycap", { opacity: 0, duration: 0.2 }, 28.4);
      unzoom(28.8);
      caption("#c8", 29.0, 30.7);
      zoom(29.4, 0.6, 2.2, 330, 165, 560, 400);
      tl.to("#cursor", { opacity: 0, duration: 0.3 }, 29.4);
      unzoom(30.4, 0.6);

      // ---- 7. Sous le capot : vue éclatée en 3D ----------------------------------------------------
      // Les trois couches s'étalent en diagonale (cadre devant et à droite, moteur derrière et à
      // gauche) pour rester lisibles ; la pile entière pivote doucement.
      tl.to("#stack", { rotationY: 24, rotationX: 10, rotationZ: -1.5, x: -360, y: 30, scale: 0.5, duration: 1.6, ease: "power3.inOut" }, 31.0);
      tl.to(".frame-tag", { opacity: 1, duration: 0.3 }, 32.3);
      tl.to("#frame", { x: 400, y: -120, z: 220, duration: 1.4, ease: "power3.inOut" }, 32.2);
      tl.fromTo("#plane-sel", { x: 400, y: -120, z: 220, opacity: 0 }, { x: 0, y: 0, z: 0, opacity: 1, duration: 1.4, ease: "power3.out" }, 32.4);
      tl.fromTo("#plane-engine", { x: 400, y: -120, z: 220, opacity: 0 }, { x: -400, y: 120, z: -220, opacity: 1, duration: 1.6, ease: "power3.out" }, 32.6);
      SX.fadeUp(tl, "#under-eyebrow", 32.8, 0.5, 16);
      SX.wipeIn(tl, "#under-title", 33.0, 0.8);
      SX.fadeUp(tl, "#p1", 34.2, 0.6, 20);
      SX.fadeUp(tl, "#p2", 36.0, 0.6, 20);
      SX.fadeUp(tl, "#p3", 37.8, 0.6, 20);
      SX.fadeUp(tl, "#under-fictive", 34.6, 0.5, 12);
      // Retour à plat.
      tl.to(["#under-eyebrow", "#under-title", "#p1", "#p2", "#p3", "#under-fictive"], { opacity: 0, duration: 0.4 }, 40.6);
      tl.to(".frame-tag", { opacity: 0, duration: 0.3 }, 40.8);
      tl.to(["#plane-sel", "#plane-engine"], { x: 400, y: -120, z: 220, opacity: 0, duration: 1.1, ease: "power3.inOut" }, 40.8);
      tl.to("#frame", { x: 0, y: 0, z: 0, duration: 1.2, ease: "power3.inOut" }, 41.0);
      tl.to("#stack", { rotationY: 0, rotationX: 0, rotationZ: 0, x: 0, y: 0, scale: 1, duration: 1.5, ease: "power3.inOut" }, 41.8);

      // ---- 8. Fin de scène --------------------------------------------------------------------------
      SX.fadeUp(tl, "#c9", 43.6, 0.6, 24);
      tl.to("#stack", { scale: 0.94, y: 20, duration: 4.2, ease: "sine.inOut" }, 43.4);

      tl.set({}, {}, 48);
      window.__timelines = window.__timelines || {};
      window.__timelines["app"] = tl;
    })();
  </script>
