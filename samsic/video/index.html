<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Samsic · pilotage de l'activité, propulsé par Qlik</title>
    <script src="./assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Roboto";
        src: url("./assets/fonts/roboto-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Roboto";
        src: url("./assets/fonts/roboto-latin-ext-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Teko";
        src: url("./assets/fonts/teko-latin-wght-normal.woff2") format("woff2");
        font-weight: 300 700;
      }

      :root {
        /* Palette Samsic (samsic/css/brand.css) */
        --paper: #ffffff;
        --paper-2: #f6f6f6;
        --slate: #333d47;
        --slate-deep: #262e36;
        --slate-2: #4a5561;
        --navy: #0b2239;
        --blue: #0081bc;
        --blue-ink: #006d9f;
        --blue-tint: #e5f2f8;
        --muted: #5f6b76;
        --rule: #d9dee3;
        --x-bg: #e8ecef;
        --font-sans: "Roboto", Arial, sans-serif;
        --font-display: "Teko", "Arial Narrow", sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--slate);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .scene--slate { background: radial-gradient(120% 90% at 30% 20%, #3b4651 0%, var(--slate) 45%, var(--slate-deep) 100%); color: #fff; }

      /* Texte */
      /* Surtitre : bleu clair sur fond ardoise, bleu profond (AA) sur le blanc des légendes */
      .eyebrow { font-size: 20px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5cc0ee; }
      .caption .eyebrow { color: var(--blue-ink); }
      .display { font-family: var(--font-display); font-weight: 300; line-height: 0.9; text-transform: uppercase; }
      .fictive {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 9px 16px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        font-size: 17px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
      }
      .fictive::before { content: ""; width: 8px; height: 8px; background: var(--blue); }

      /* Cadre de navigateur */
      .frame {
        position: absolute;
        left: 240px; top: 60px;
        width: 1440px;
        background: #fff;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .frame__bar {
        height: 36px;
        display: flex; align-items: center; gap: 8px;
        padding: 0 16px;
        background: #e9edf0;
        border-bottom: 1px solid var(--rule);
      }
      .frame__dot { width: 11px; height: 11px; border-radius: 50%; background: #c5ccd3; }
      .frame__url {
        margin-left: 18px; height: 22px; width: 460px;
        padding: 0 12px;
        background: #fff;
        font-size: 13px; line-height: 22px; color: var(--muted);
      }
      .frame__view { position: relative; width: 1440px; height: 900px; overflow: hidden; background: #fff; }
      .stage { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
      .layer { position: absolute; left: 0; top: 0; width: 1440px; }
      .shot { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; opacity: 0; }
      .wipe-in { -webkit-mask-image: linear-gradient(to right, #000 calc(var(--w, 112%) - 12%), transparent var(--w, 112%)); mask-image: linear-gradient(to right, #000 calc(var(--w, 112%) - 12%), transparent var(--w, 112%)); }

      /* Curseur et clic */
      .cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; opacity: 0; z-index: 20; }
      .ripple {
        position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px;
        border: 3px solid var(--blue); border-radius: 50%; opacity: 0; z-index: 19;
      }

      /* Légendes */
      .caption {
        position: absolute; left: 96px; bottom: 74px;
        width: 560px;
        padding: 26px 32px 28px;
        background: #fff;
        border-left: 6px solid var(--blue);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        opacity: 0;
        z-index: 30;
      }
      .caption__title {
        margin-top: 10px;
        font-size: 33px; font-weight: 500; line-height: 1.15; text-transform: uppercase; color: var(--slate);
      }

      /* Transition : balayage bleu vers la droite */
      #wipe { position: absolute; inset: 0; z-index: 100; pointer-events: none; overflow: hidden; }
      .wipe-bar { position: absolute; top: 0; bottom: 0; left: 0; width: 1920px; background: var(--blue); }
      .wipe-bar--2 { background: var(--slate-deep); }
    </style>
    <script>
      // Outils partagés par les scènes.
      window.SX = {
        fadeUp(tl, sel, at, d = 0.7, y = 30) {
          tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, at);
        },
        fadeOut(tl, sel, at, d = 0.35) {
          tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: d, ease: "power2.in", immediateRender: false }, at);
        },
        // Révélation d'un texte ou d'un bloc par balayage vers la droite (bord adouci).
        wipeIn(tl, sel, at, d = 0.8) {
          tl.fromTo(sel, { "--w": "0%", opacity: 1 }, { "--w": "112%", duration: d, ease: "power2.inOut" }, at);
        },
      };
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div id="s-intro" class="clip" data-composition-id="intro" data-composition-src="compositions/intro.html"
           data-start="0" data-duration="4" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="s-app" class="clip" data-composition-id="app" data-composition-src="compositions/app.html"
           data-start="4" data-duration="48" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="s-outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html"
           data-start="52" data-duration="8" data-track-index="0" data-width="1920" data-height="1080"></div>

      <!-- Transitions : deux bandes (bleu Samsic puis ardoise) balaient l'écran vers la droite. -->
      <div id="wipe" class="clip" data-layout-allow-overflow data-start="0" data-duration="60" data-track-index="1">
        <i class="wipe-bar"></i><i class="wipe-bar wipe-bar--2"></i>
      </div>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        // Position de départ posée par GSAP seul : un translateX en CSS s'ajouterait à xPercent.
        gsap.set(".wipe-bar", { xPercent: -100 });
        [4, 52].forEach((T) => {
          tl.fromTo(".wipe-bar", { xPercent: -100 }, { xPercent: 0, duration: 0.42, ease: "power3.in", stagger: 0.07, immediateRender: false }, T - 0.5);
          tl.fromTo(".wipe-bar", { xPercent: 0 }, { xPercent: 100, duration: 0.5, ease: "power3.out", stagger: -0.07, immediateRender: false }, T + 0.02);
        });
        tl.set({}, {}, 60);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
